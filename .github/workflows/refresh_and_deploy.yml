name: Refresh and Deply to GitHub Pages

# Babble
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "**" # Disable :3
    paths:
      - "**" # Everything is considered
      
      - "!.*" # Ignore dotfiles
      - "!.*/**" # Ignore dotfolders
      - ".packwizignore" # Except packwiz's ignore file
  
      # Other files and folders
      - "!README.md"
      - "build-shell.nix" # If we update the build shell
      - ".github/workflows/refresh_and_deploy.yml" # If we update this workflow
      - "!SAFEGUARDED/**" # Folder to dump things we want to keep around and then move idk

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Runner
jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      # Setup
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      
      # Upload
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
